# MyBatis: snake_case のカラム名を camelCase の property に対応させる（todo.adapter.persistence の TaskRow）
mybatis.configuration.map-underscore-to-camel-case=true

# 型の自動変換をしない。タイトルが数値・真偽値、期限が数値などの本文は、"123" や "20261130" に変換せず、
# 本文が JSON として読めない場合と同じ MALFORMED_REQUEST の 400 にする（TRS TODO-001 OI-013、AC-01-29）。
# 文字列の項目への数値・真偽値の変換は、この設定では止まらないので、config の JacksonConfiguration で止める。
spring.jackson.mapper.allow-coercion-of-scalars=false
# 定義にない項目は無視する（OI-013、AC-01-30）。Spring Boot の既定を、決定として明示する
spring.jackson.deserialization.fail-on-unknown-properties=false
