# 型の違う値を黙って変換しない（"3" や 1.5 を Int として受け取らない）。TRS ORD-001 AC-01-10 / OI-005 a
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

# MyBatis: snake_case のカラム名を camelCase の property に対応させる（payment.adapter.persistence）
mybatis.configuration.map-underscore-to-camel-case=true
