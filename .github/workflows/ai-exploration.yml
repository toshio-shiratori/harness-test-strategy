name: AI Exploration

# 層3(探索・発見層)の AI 探索を、手で起動して一度だけ実行する(手順書: examples/kotlin-spring/docs/02b.md の §3.1)。
# 定期実行は置かない(schedule のトリガーを書かない)。費用は起動したときだけ発生する。
# AI の API キー(リポジトリのシークレット ANTHROPIC_API_KEY)が未設定なら、探索をせず成功で終わる。
on:
  workflow_dispatch:
    inputs:
      model:
        description: "探索に使うモデルの ID"
        type: string
        default: claude-sonnet-5-5
      max_budget_usd:
        description: "費用の上限(USD)。claude の推定値で止める"
        type: string
        default: "3"
      max_turns:
        description: "エージェントの最大ターン数"
        type: string
        default: "100"

permissions:
  contents: read

jobs:
  # secrets は if に直接書けないため、ここで有無だけを真偽値にして次のジョブへ渡す。キーの値は出力しない
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
    steps:
      - name: 入力の検証
        env:
          MODEL: ${{ inputs.model }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          [[ "$MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "model の形式が不正です"; exit 1; }
          [[ "$MAX_BUDGET_USD" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "max_budget_usd は数値で指定してください"; exit 1; }
          [[ "$MAX_TURNS" =~ ^[0-9]+$ ]] || { echo "max_turns は整数で指定してください"; exit 1; }
      - id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## AI 探索: 実行しませんでした"
              echo
              echo "リポジトリのシークレット \`ANTHROPIC_API_KEY\` が未設定のため、探索をせずに成功で終えました。費用は発生していません。"
              echo "実行するには、シークレットを登録してから、もう一度起動してください。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  explore:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    defaults:
      run:
        working-directory: examples/kotlin-spring
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ジョブ単位の env では runner コンテキストを使えないため、出力先はここで決める
      - name: 出力先を決める
        run: echo "OUT_DIR=$RUNNER_TEMP/exploration" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # claude のパッケージは Node.js 22 以上を要する
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # アプリの起動は examples/kotlin-spring/README.md の「サンプルアプリを手元で動かす」と同じ
      - name: MySQL を起動
        run: |
          docker run -d --rm --name harness-sample-mysql \
            -e MYSQL_ROOT_PASSWORD=sample -e MYSQL_DATABASE=sample \
            -p 3306:3306 mysql:8.4
          for _ in $(seq 1 60); do
            if docker exec harness-sample-mysql mysqladmin ping -h127.0.0.1 -uroot -psample --silent 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL が起動しませんでした"
          docker logs harness-sample-mysql
          exit 1
      - name: アプリを起動
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/sample
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: sample
        run: |
          mkdir -p "$OUT_DIR"
          nohup ./gradlew bootRun > "$OUT_DIR/app.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "アプリが起動しませんでした"
          tail -n 50 "$OUT_DIR/app.log"
          exit 1

      # バージョンは固定する。MCP サーバーの初回取得で起動が遅れないよう、ここで取得しておく
      - name: claude と Playwright MCP を用意
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.316
          npx -y @playwright/mcp@0.0.84 --help > /dev/null
          claude --version

      # 入力の組み立て。リポジトリのスクリプトを動かすため、キーを持たないこのステップで行う
      - name: プロンプトと MCP 設定を組み立てる
        run: |
          mkdir -p "$OUT_DIR/playwright"
          exploration/build-prompt.sh > "$OUT_DIR/prompt.txt"
          jq -c . exploration/report-schema.json > "$OUT_DIR/schema.json"
          jq -n --arg dir "$OUT_DIR/playwright" '{
            mcpServers: { playwright: { command: "npx", args: [
              "-y", "@playwright/mcp@0.0.84",
              "--headless", "--browser", "chrome", "--isolated", "--no-sandbox",
              "--allowed-origins", "http://localhost:8080",
              "--output-dir", $dir
            ] } }
          }' > "$OUT_DIR/mcp.json"

      # 探索。ブラウザ操作の道具だけを渡す(組み込みのツールはすべて外す)。
      # キーを渡すのはこのステップだけで、リポジトリのスクリプトは動かさない。
      # ただし、claude が起動する MCP サーバー(npx)の子プロセスも、環境変数のキーを継承する。
      # 失敗しても、成果物とサマリを残すため終了コードは取っておき、最後のステップで失敗にする。
      # 時間の上限(下の timeout)はジョブの上限より短くし、時間切れでもサマリを残す。時間切れは終了コード 124
      - name: AI 探索
        id: explore
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set +e
          start="$(date +%s)"
          timeout 1200 claude --bare -p "$(cat "$OUT_DIR/prompt.txt")" \
            --model "$MODEL" \
            --max-budget-usd "$MAX_BUDGET_USD" \
            --max-turns "$MAX_TURNS" \
            --tools "" \
            --strict-mcp-config --mcp-config "$OUT_DIR/mcp.json" \
            --allowedTools "mcp__playwright__*" \
            --permission-mode dontAsk \
            --output-format json --json-schema "$(cat "$OUT_DIR/schema.json")" \
            > "$OUT_DIR/claude-output.json" 2> "$OUT_DIR/claude-stderr.log"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "elapsed=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          exit 0

      - name: サマリと報告を出力
        if: always() && steps.explore.outcome == 'success'
        env:
          MODEL: ${{ inputs.model }}
          STATUS: ${{ steps.explore.outputs.status }}
          ELAPSED: ${{ steps.explore.outputs.elapsed }}
        run: |
          exploration/render-report.sh "$OUT_DIR/claude-output.json" "$STATUS" "$ELAPSED" "$MODEL" \
            | tee "$OUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ai-exploration-${{ github.run_number }}
          path: ${{ runner.temp }}/exploration
          if-no-files-found: warn
          retention-days: 14

      - name: claude が失敗していたら、ジョブを失敗にする
        if: always() && steps.explore.outcome == 'success' && steps.explore.outputs.status != '0'
        env:
          STATUS: ${{ steps.explore.outputs.status }}
        run: |
          echo "claude が終了コード $STATUS で終わりました。サマリと成果物を確認してください"
          exit 1
