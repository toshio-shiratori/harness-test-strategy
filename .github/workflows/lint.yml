name: Lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - "puppeteer-config.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # mermaid-cli が使う Chrome (puppeteer) のダウンロード結果をキャッシュ
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # ローカルと同一のコマンド（markdownlint + Mermaid 構文検査）
      - run: npm run lint
