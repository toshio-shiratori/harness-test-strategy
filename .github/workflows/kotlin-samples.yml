name: Kotlin Samples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # PR の差分ミューテーションで base との差分を取るため
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # docs/testing/02-test-architecture.md のサンプルコードの静的解析・テスト（ローカルも同一コマンド）
      - run: ./gradlew detekt ktlintCheck test
      # ミューテーションテスト: PR は変更クラスのみ（差分）、main への push は全体
      - name: pitest
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            targets="$(scripts/pitest-targets.sh "origin/$BASE_REF")"
          else
            targets=ALL
          fi
          echo "pitest targets: $targets"
          if [ "$targets" = "NONE" ]; then
            echo "ミューテーション対象の変更なし"
          elif [ "$targets" = "ALL" ]; then
            ./gradlew pitest
          else
            ./gradlew pitest "-Ppitest.targetClasses=$targets"
          fi

  # Spring コンテキストを起動するテスト（@WebMvcTest・@SpringBootTest・Testcontainers の DB 統合）。
  # `test` ジョブは Docker なしの層1だけ。ubuntu-latest には Docker が入っている
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - run: ./gradlew integrationTest
