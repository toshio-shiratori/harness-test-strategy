name: Kotlin Samples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # PR の差分ミューテーションで base との差分を取るため
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # docs/testing/02a-types-and-pbt.md と docs/testing/02b-execution-and-mutation.md のサンプルコードの静的解析・テスト（ローカルも同一コマンド）
      - run: ./gradlew detekt ktlintCheck test
      # ミューテーションテスト: PR は変更クラスのみ（差分）、main への push は全体
      - name: pitest
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            targets="$(scripts/pitest-targets.sh "origin/$BASE_REF")"
          else
            targets=ALL
          fi
          echo "pitest targets: $targets"
          if [ "$targets" = "NONE" ]; then
            echo "ミューテーション対象の変更なし"
          elif [ "$targets" = "ALL" ]; then
            ./gradlew pitest
          else
            ./gradlew pitest "-Ppitest.targetClasses=$targets"
          fi

  # Spring コンテキストを起動するテスト（@WebMvcTest・@SpringBootTest・Testcontainers の DB 統合）。
  # `test` ジョブは Docker なしの層1だけ。ubuntu-latest には Docker が入っている
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - run: ./gradlew integrationTest

  # 実ブラウザ（Playwright の Chromium）で動かす E2E。`integration` と同じく Docker（Testcontainers の MySQL）が要る。
  # Chromium は `e2eTest` が依存する `playwrightInstall` が取得する。取得先をキャッシュする。
  # 02c §5.4 の E2E 予算（PR パイプライン内で 10 分以内）を timeout-minutes の上限にする。失敗をリトライや continue-on-error で隠さない
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # Playwright のブラウザ（Chromium）のダウンロード結果をキャッシュ。キーは build.gradle.kts のハッシュ(Playwright のバージョンが変わればキーも変わる)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
      - run: ./gradlew e2eTest
      # 失敗時のトレース・スクリーンショットと Gradle のテストレポート
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-artifacts-${{ github.run_number }}
          path: |
            build/e2e-artifacts
            build/reports/tests/e2eTest
            build/test-results/e2eTest
          if-no-files-found: warn
          retention-days: 14
