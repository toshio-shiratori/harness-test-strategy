name: Kotlin Samples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # docs/testing/02-test-architecture.md のサンプルコードのコンパイル・テスト・ミューテーションテスト（ローカルも同一コマンド）
      - run: ./gradlew detekt ktlintCheck test pitest
