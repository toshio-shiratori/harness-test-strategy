name: PR ID Changes Check

# 生成物のファイル(TRS の US・UC・AC・組合せ別の期待結果)で、既存の ID の変化を列挙し、PR 本文の「## 既存の ID の変化」の節に、
# ID ごとの理由が無ければ失敗にする(03b §1 の例外)。列挙するのは、消えた、中身が変わった、AC が pending になった、過去に使った ID が戻った、のどれか。
# 本文を直したときに再実行されるよう、edited も契機にする。
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  id-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 過去に使った ID を履歴から集める。履歴が浅いと使い回しを検出できないので、スクリプトは浅い履歴を失敗にする
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # 本文と SHA は信頼できない入力なので、式展開ではなく環境変数で渡す
      - run: node scripts/check-id-changes.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
